name: release

# Construit les binaires et les attache a la release du tag.
# Sur un tag pousse : les 4 plateformes. En declenchement manuel : au choix,
# pour ne pas consommer inutilement les minutes macOS (facturees 10x).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de version a construire (ex. v0.1.0)'
        required: true
      platforms:
        description: 'Plateformes a construire'
        type: choice
        required: true
        default: toutes
        options:
          - toutes
          - windows,linux
          - windows
          - linux
          - macos

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          SEL="${{ github.event.inputs.platforms || 'toutes' }}"
          ALL='[
            {"key":"macos-arm64","platform":"macos-latest","args":"--target aarch64-apple-darwin","rust":"aarch64-apple-darwin"},
            {"key":"macos-x64","platform":"macos-latest","args":"--target x86_64-apple-darwin","rust":"x86_64-apple-darwin"},
            {"key":"linux","platform":"ubuntu-22.04","args":"","rust":""},
            {"key":"windows","platform":"windows-latest","args":"","rust":""}
          ]'
          if [ "$SEL" = "toutes" ]; then
            M=$(echo "$ALL" | jq -c .)
          else
            M=$(echo "$ALL" | jq -c --arg sel "$SEL" \
              '($sel|split(",")) as $s | [ .[] | select( .key as $k | $s | any(. as $x | $k|startswith($x)) ) ]')
          fi
          echo "plateformes retenues : $(echo "$M" | jq -r '[.[].key]|join(", ")')"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Dependances systeme Linux
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Installer les dependances
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
