[package]
name = "iakatokencounter-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI tray iakaTokenCounter (Tauri v2) : icone barre systeme + popover de jauges de reservoir par compte IA, subscriber MQTT retained du contrat, daemon iakatc-daemon spawne en sidecar."

[lib]
name = "iakatokencounter_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "iakatokencounter-tray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
rumqttc = "0.24"
serde = { workspace = true }
serde_json = { workspace = true }
# Coeur de mesure (lecture d'activite read-only pour la commande get_history, D2/D3).
iakatc-core = { path = "../iakatc-core" }
