[package]
name = "iakatokencounter-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI tray iakaTokenCounter (Tauri v2) : icone barre systeme + popover de jauges de reservoir par compte IA, subscriber MQTT retained du contrat, daemon iakatc-daemon spawne en sidecar."

[lib]
name = "iakatokencounter_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "iakatokencounter-tray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
# Composition + rasterisation RGBA de l'icone de tray (logo officiel + mini-reservoirs, D2).
# Voie A de la spec (docs/design/tray-icon-spec.html) : SVG compose -> raster. resvg re-exporte
# usvg + tiny_skia (pas de mismatch de version). `text`+`system-fonts` : rendu de l'initiale du
# fallback ; on trime le reste (raster/gif/webp) pour alleger l'arbre de deps. Epingle.
resvg = { version = "=0.47.0", default-features = false, features = ["text", "system-fonts"] }
rumqttc = "0.24"
serde = { workspace = true }
serde_json = { workspace = true }
# Coeur de mesure (lecture d'activite read-only pour la commande get_history, D2/D3).
iakatc-core = { path = "../iakatc-core" }
# Info systeme (RAM) pour la courbe de monitoring memoire persistante (feature-detail-memory-monitor).
# Cross-OS macOS/Windows/Linux. `default-features = false` + `features = ["system"]` : on lit la
# memoire seule, sans enumeration des process (couteuse et gourmande en RAM sur macOS) ni multi-thread.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
