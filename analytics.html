<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics — historique</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="analytics">
    <header class="an-top">
      <div class="an-titles">
        <h1 id="title">Historique</h1>
        <span id="updated" class="an-updated"></span>
      </div>
      <button id="refresh" class="an-refresh" type="button">Rafraichir</button>
    </header>

    <p id="scope" class="an-scope"></p>

    <section class="an-quota">
      <h2 class="viz-title">Quota courant du compte</h2>
      <div id="quota"></div>
    </section>

    <main id="history" class="an-history"></main>

    <section class="an-memory">
      <h2 class="viz-title">Memoire systeme (RAM)</h2>
      <div id="memory"></div>
    </section>

    <script type="module" src="/src/analytics.ts"></script>
  </body>
</html>
